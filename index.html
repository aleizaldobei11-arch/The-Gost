<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />

  <title>تحدي المائة سؤال</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(135deg, #0a0a1a, #12122a, #0a0a1a);
      color: white;
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      color: #4fc3f7;
      font-size: 1.2rem;
    }
    .timer, .question-counter {
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 15px;
      border-radius: 10px;
      font-weight: bold;
    }
    .logo {
      font-size: 2.2rem;
      margin: 15px 0;
      color: #00ffc3;
      text-shadow: 0 0 15px rgba(0, 255, 195, 0.6);
    }
    .question-box {
      width: 100%;
      max-width: 700px;
      background: rgba(20, 20, 40, 0.7);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 0 25px rgba(0, 255, 195, 0.3);
      margin-bottom: 25px;
      text-align: center;
    }
    .question-text {
      font-size: 1.6rem;
      line-height: 1.6;
      margin-bottom: 25px;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .option {
      padding: 14px;
      background: #1e1e3a;
      border: 2px solid #3a3a6a;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.2s;
    }
    .option:hover {
      background: #2a2a4a;
      border-color: #00ffc3;
    }
    .option.correct {
      background: #2e7d32 !important;
      color: white;
      border-color: #4caf50;
    }
    .option.wrong {
      background: #c62828 !important;
      color: white;
      border-color: #f44336;
    }
    .feedback {
      margin-top: 20px;
      font-size: 1.4rem;
      min-height: 30px;
    }
    .btn {
      margin-top: 20px;
      padding: 12px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #00ffc3;
      color: #000;
      transition: background 0.3s;
    }
    .btn:hover {
      background: #00cca0;
    }
    .hidden {
      display: none;
    }

    .signature {
      margin-top: 40px;
      text-align: center;
      font-size: 1.3rem;
      font-weight: bold;
      color: #00ff9d;
      text-shadow: 0 0 12px rgba(0, 255, 157, 0.9);
      padding: 12px 20px;
      border-bottom: 3px solid #000;
      max-width: 800px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
    }
  </style>
</head>

    function startGame() {
      currentQuestions = shuffleArray(questions);
      currentQuestionIndex = 0;
      questionNumber = 1;
      time = 0;
      document.getElementById("qNum").textContent = questionNumber;
      document.getElementById("time").textContent = time;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        time++;

      }, 1000);
      loadQuestion();
    }

    function loadQuestion() {
      if (currentQuestionIndex >= currentQuestions.length) {
        document.getElementById("question").textContent = "🎉 مبروك! أنهيت جميع الأسئلة!";
        document.getElementById("options").innerHTML = "";
        document.getElementById("feedback").textContent = "أنت بطل المعرفة!";
        document.getElementById("nextBtn").classList.add("hidden");
        return;
      }

      const q = currentQuestions[currentQuestionIndex];
      document.getElementById("question").textContent = q.question;
      document.getElementById("feedback").textContent = "";
      document.getElementById("nextBtn").classList.add("hidden");
      document.getElementById("retryBtn").classList.add("hidden");

      const optionsHTML = q.answers.map((ans, idx) => 
        `<div class="option" onclick="selectAnswer(${idx})">${ans}</div>`
      ).join("");
      document.getElementById("options").innerHTML = optionsHTML;
    }

    function selectAnswer(selectedIndex) {
      const q = currentQuestions[currentQuestionIndex];
      const options = document.querySelectorAll(".option");
      options.forEach(opt => opt.style.pointerEvents = "none");

      if (selectedIndex === q.correct) {
        options[selectedIndex].classList.add("correct");
        document.getElementById("feedback").textContent = "✅ إجابة صحيحة! أحسنت!";
        document.getElementById("nextBtn").classList.remove("hidden");
      } else {
        options[selectedIndex].classList.add("wrong");
        options[q.correct].classList.add("correct");
        document.getElementById("feedback").textContent = "❌ إجابة خاطئة. حاول مرة أخرى!";
        document.getElementById("retryBtn").classList.remove("hidden");
      }
    }

    function nextQuestion() {
      currentQuestionIndex++;
      questionNumber++;
      document.getElementById("qNum").textContent = questionNumber;
      loadQuestion();
    }

    function resetGame() {
      clearInterval(timerInterval);
      startGame();
    }
